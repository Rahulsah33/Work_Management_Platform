# ===================================================
# Production Profile Configuration
# ===================================================

# Database credentials must come from environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA settings - disable SQL tracing
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Security & Secrets
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Logging - concise and secure
logging.level.root=WARN
logging.level.com.Workmanagement=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=ERROR

# Observability - Minimal Actuator exposure
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false
management.info.java.enabled=false
management.info.os.enabled=false

# Swagger configuration - configurable via environment variable
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Cookie Settings for HTTPS Production
cookie.secure=${COOKIE_SECURE:true}
cookie.same-site=${COOKIE_SAME_SITE:Lax}

