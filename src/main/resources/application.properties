spring.application.name=Work-management

server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===============================
# Database
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ===============================
# JWT
# ===============================
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false
management.info.java.enabled=false
management.info.os.enabled=false

# ===============================
# Application Info
# ===============================
info.app.name=AI-Powered Work Management Platform
info.app.version=1.0.0
info.app.description=AI-Powered Work Management System Backend API

# ===============================
# Spring AI
# ===============================
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.7-flash}
spring.ai.google.genai.chat.temperature=0.2
spring.ai.google.genai.chat.response-mime-type=application/json

spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=5s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=30s

# ===============================
# Logging
# ===============================
logging.level.root=WARN
logging.level.com.Workmanagement=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=ERROR

# ===============================
# Cookie
# ===============================
cookie.secure=${COOKIE_SECURE:true}
cookie.same-site=${COOKIE_SAME_SITE:Lax}