spring.application.name=Work-management
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Default active profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/work_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rahul123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=update

# ===============================
# JWT Authentication
# ===============================
jwt.secret=${JWT_SECRET:MySuperSecretKeyForWorkManagement2026DefaultKey32Bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ===============================
# Spring Boot Actuator & Observability
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false
management.info.java.enabled=false
management.info.os.enabled=false

# Application Information (/actuator/info)
info.app.name=AI-Powered Work Management Platform
info.app.version=1.0.0
info.app.description=AI-Powered Work Management System Backend API

# ===============================
# Spring AI - Gemini
# ===============================
spring.ai.google.genai.api-key=${GEMINI_API_KEY:dummy-dev-api-key}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.7-flash}
spring.ai.google.genai.chat.temperature=0.2
spring.ai.google.genai.chat.response-mime-type=application/json

spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=5s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=30s