spring.application.name=Work-management-test

# ===============================
# Isolated Test Database (H2 in MySQL mode)
# ===============================
spring.datasource.url=jdbc:h2:mem:work_management_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# ===============================
# JWT & Security
# ===============================
jwt.secret=TestSuperSecretKeyForWorkManagement2026IntegrationTestsMinimum32Bytes
jwt.expiration-ms=3600000

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===============================
# Spring AI Gemini Dummy Key for Context Loading
# ===============================
spring.ai.google.genai.api-key=dummy-test-api-key-12345
